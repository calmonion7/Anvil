# 실제 앱을 빌드해 띄우고 첫 실행 흐름(준비물 띠 → [설치] → 세션 열기)을 Linux·Windows에서 기계 판정한다.
# 버전 올리는 PR(머지 = 릴리스)의 사전 검사 + 수동 실행. 평소 PR에는 돌지 않는다(하네스 자신을 바꾼 PR만 예외).
# 결과는 단계별 스크린샷·로그 아티팩트 — `gh run download <id>`로 받아 본다.
name: e2e-desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - e2e-desktop/**
      - .github/workflows/e2e-desktop.yml

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: 앱 빌드(디버그 · 번들 없이)
        run: npx tauri build --debug --no-bundle

      - name: tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: 하네스
        working-directory: e2e-desktop
        run: npm ci

      # 앱은 러너가 아니라 깨끗한 ubuntu:22.04 컨테이너에서 띄운다(러너엔 node 등이 이미 있다)
      - name: 시나리오(깨끗한 PC · 옛 node)
        run: bash e2e-desktop/linux/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-desktop-linux
          path: e2e-desktop/out/

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      ANVIL_BIN: ${{ github.workspace }}\src-tauri\target\debug\anvil.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # msedgedriver가 WebView2에 붙지 못해(tauri#10670) 테스트 빌드만 웹뷰 디버그 포트 9222를 열고, Playwright가 CDP로 붙는다.
      # 창 설정을 통째로 덮어쓰므로 tauri.conf.json의 창 설정을 바꾸면 e2e-desktop/tauri.e2e.json도 맞춘다.
      - name: 앱 빌드(디버그 · 번들 없이 · 디버그 포트)
        run: npx tauri build --debug --no-bundle --config "${{ github.workspace }}\e2e-desktop\tauri.e2e.json"

      - name: 하네스
        working-directory: e2e-desktop
        run: npm ci

      - name: 시험 프로젝트 등록
        run: |
          New-Item -ItemType Directory -Force C:\anvil-e2e-project, "$env:APPDATA\com.taebro.anvil" | Out-Null
          '["C:\\anvil-e2e-project"]' | Set-Content -Encoding utf8NoBOM "$env:APPDATA\com.taebro.anvil\projects.json"

      - name: ⓪ WSL 없이
        working-directory: e2e-desktop
        env:
          E2E_OUT: out/windows-0-no-wsl
        run: |
          New-Item -ItemType Directory -Force $env:E2E_OUT | Out-Null
          wsl --status *> "$env:E2E_OUT\wsl-status.log"
          npx playwright test --config windows/playwright.config.mjs before-wsl

      - uses: Vampire/setup-wsl@v7.2.0
        if: ${{ !cancelled() }}
        with:
          distribution: Ubuntu-22.04
          wsl-version: 1

      - name: ① WSL1 Ubuntu에서
        if: ${{ !cancelled() }}
        working-directory: e2e-desktop
        env:
          E2E_OUT: out/windows-1-wsl
        run: |
          New-Item -ItemType Directory -Force $env:E2E_OUT | Out-Null
          wsl -l -v *> "$env:E2E_OUT\wsl-list.log"
          wsl -- bash -lc "uname -a; for p in node tmux claude curl git; do printf '%s: ' `$p; command -v `$p || echo 없음; done" *> "$env:E2E_OUT\env.log"
          npx playwright test --config windows/playwright.config.mjs after-wsl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-desktop-windows
          path: e2e-desktop/out/
