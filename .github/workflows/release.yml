# main push(버전이 새로 바뀌었을 때) 또는 v* 태그 → macOS·Windows·Ubuntu에서 electron-builder 빌드 → 체크섬 목록과 함께 draft 릴리스에 첨부 → 공개.
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 릴리스할 태그를 정한다. main push 면 package.json 버전의 태그가 없을 때만 만든다(있으면 tag 가 비어 이후 작업은 건너뛴다).
  # GITHUB_TOKEN 으로 push 한 태그는 이 워크플로를 다시 깨우지 않으므로 이중 빌드가 없다.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: t
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0; fi
          v="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v 태그가 이미 있다 — 릴리스하지 않는다"; exit 0; fi
          [ -s "docs/releases/$v.md" ] || { echo "::error::버전 $v 의 릴리스 노트 docs/releases/$v.md 가 없다"; exit 1; }
          git tag "$v" && git push origin "$v"
          echo "tag=$v" >> "$GITHUB_OUTPUT"

  # electron-builder로 네 대상(mac arm64·x64 dmg+zip, Windows x64 설치 프로그램, Linux x64 AppImage)을 만든다 — 서명 없음(ADR 261030-005852).
  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  # 세 빌드가 모두 성공해야 공개한다 — 체크섬 목록(자체 업데이터가 검증에 쓴다)을 만들어 draft에 함께 붙이고, 다 붙은 뒤 공개한다.
  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: release-*
          merge-multiple: true

      - name: 체크섬 목록
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          n=$(ls | grep -c -E '\.(dmg|zip|exe|AppImage)$')
          [ "$n" = 6 ] || { echo "::error::설치 파일이 6개가 아니다($n)"; exit 1; }

      - name: draft 릴리스 → 첨부 → 공개
        run: |
          f="docs/releases/${TAG}.md"
          [ -s "$f" ] || { echo "::error::릴리스 노트 $f 가 없다"; exit 1; }
          gh release create "$TAG" out/* --draft --title "Anvil $TAG" --notes-file "$f" --verify-tag
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets --jq '.assets[].name'
