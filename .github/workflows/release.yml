# main push(버전이 새로 바뀌었을 때) 또는 v* 태그 → macOS·Windows·Ubuntu 빌드 → draft 릴리스 하나에 결과물·업데이터 json 첨부 → 모두 성공하면 공개.
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 릴리스할 태그를 정한다. main push 면 package.json 버전의 태그가 없을 때만 만든다(있으면 tag 가 비어 이후 작업은 건너뛴다).
  # GITHUB_TOKEN 으로 push 한 태그는 이 워크플로를 다시 깨우지 않으므로 이중 빌드가 없다.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: t
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0; fi
          v="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v 태그가 이미 있다 — 릴리스하지 않는다"; exit 0; fi
          [ -s "docs/releases/$v.md" ] || { echo "::error::버전 $v 의 릴리스 노트 docs/releases/$v.md 가 없다"; exit 1; }
          git tag "$v" && git push origin "$v"
          echo "tag=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: 리눅스 의존성
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: 릴리스 노트
        id: notes
        shell: bash
        run: |
          f="docs/releases/${TAG}.md"
          [ -s "$f" ] || { echo "::error::릴리스 노트 $f 가 없다"; exit 1; }
          { echo "body<<__NOTES__"; cat "$f"; echo; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: Anvil ${{ needs.tag.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # 네 빌드가 모두 성공해야 공개한다(도중에 공개하면 latest.json 이 덜 찬 채 업데이터에 보인다).
  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: draft 공개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # draft 는 tag_name 이 untagged-… 로 보여 태그로 못 찾는다 → build 의 releaseName 으로 찾고 태그를 붙여 공개.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .name == \"Anvil $TAG\") | .id" | head -1)
          [ -n "$id" ] || { echo "::error::$TAG draft 릴리스가 없다"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f tag_name="$TAG" -F draft=false -f make_latest=true --jq '.html_url'
