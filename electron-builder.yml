# 데스크톱 앱 설치 파일(electron-builder) — `npm run dist:mac` → dist/. 서명 없음(ADR 261030-005852).
# 창은 build/(vite 산출물)을 서버가 내고, 서버(server/)는 앱 안 Electron을 node로 부른다.
appId: com.taebro.anvil
productName: Anvil
directories:
  output: dist
files:
  - package.json
  - electron/**
  - server/**
  - "!server/test/**"
  - build/**
# node-pty는 N-API prebuild가 Electron에서도 그대로 돈다(실측 2026-10-30) — 다시 빌드하지 않는다.
npmRebuild: false
# 네이티브 모듈(.node·spawn-helper)은 asar 안에서 실행할 수 없다.
asarUnpack:
  - node_modules/node-pty/**
# 아이콘은 icons/(OS마다 한 파일).
# 파일 이름은 자체 업데이터(server/updater.js pickAsset)가 고르는 규칙이다 — 바꾸면 거기도 바꾼다.
win:
  icon: icons/icon.ico
  artifactName: Anvil-${version}-win-x64.${ext}
  target:
    - target: nsis # 사용자 범위 설치(관리자 권한 없음). 서명 없음 — 처음 한 번 SmartScreen 「추가 정보 → 실행」
      arch: x64
nsis:
  oneClick: true
  perMachine: false
linux:
  icon: icons/icon.png
  category: Development
  artifactName: Anvil-${version}-linux-x86_64.${ext}
  target:
    - target: AppImage
      arch: x64
mac:
  icon: icons/icon.icns
  identity: null
  artifactName: Anvil-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # 자체 업데이터가 풀어 .app을 바꾼다
      arch: [arm64, x64]
